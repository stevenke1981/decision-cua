[project]
name = "decision-cua"
version = "0.1.0"
description = "Computer use for ANY LLM on Windows: UI Automation perception + Microsoft-Decision-1 grounding/guarding via OpenRouter Decisions API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Steven" }]
# 核心只依賴 httpx；其餘依功能選裝
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
windows = ["uiautomation>=2.0.20; sys_platform == 'win32'"]
mcp = ["mcp>=1.6"]
vision = ["pillow>=10"]
all = [
  "uiautomation>=2.0.20; sys_platform == 'win32'",
  "mcp>=1.6",
  "pillow>=10",
]
dev = ["pytest>=8"]

[project.scripts]
dcua = "dcua.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
